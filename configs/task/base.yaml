# Arguments of lm_eval.simple_evaluate; scripts/eval.py passes the model.
_target_: lm_eval.evaluator.simple_evaluate
tasks: ???
num_fewshot: 0  # prompts are formatted zero-shot by the adapter
limit: null  # number of examples (null: all)
batch_size: 1
log_samples: true  # kept in memory only; required by the generation-only code tasks
